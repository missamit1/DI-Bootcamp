<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Star Wars Character Finder</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <h1 aria-label="Star Wars"><span>STAR</span><span>WARS</span></h1>
    <section id="character" aria-live="polite" aria-busy="false">
      <h2>Explore the galaxy</h2>
      <p>Find someone from the Star Wars universe.</p>
    </section>
    <button id="find-button" type="button">Find Someone</button>
  </main>
</body>
</html>
