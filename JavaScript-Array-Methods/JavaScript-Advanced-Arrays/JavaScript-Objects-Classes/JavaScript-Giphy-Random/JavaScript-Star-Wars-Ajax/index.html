<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Star Wars Characters</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <h1>STAR WARS</h1>
      <h2>Random Character Generator</h2>

      <section class="character-card">
        <div id="loading" hidden>
          <i class="fa-solid fa-spinner fa-spin"></i>
          Loading...
        </div>

        <div id="error" hidden>Oh no! That person isn't available.</div>

        <div id="character" hidden>
          <h3 id="name"></h3>
          <p id="height"></p>
          <p id="gender"></p>
          <p id="birth-year"></p>
          <p id="homeworld"></p>
        </div>
      </section>

      <button id="find-button">Find Someone</button>
    </main>

    <script src="script.js"></script>
  </body>
</html>
