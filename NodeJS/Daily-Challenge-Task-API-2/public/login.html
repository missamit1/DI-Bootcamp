<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login</title><link rel="stylesheet" href="style.css"><script src="form.js" defer></script></head>
<body><main><h1>Login</h1><form action="/login" method="post">
<label for="username">Username</label><input id="username" name="username" type="text" autocomplete="username" required>
<label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
<button type="submit" disabled>Login</button></form><p id="message" role="status" aria-live="polite"></p><a href="register.html">Register</a></main></body></html>
