<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Register</title><link rel="stylesheet" href="style.css"><script src="form.js" defer></script></head>
<body><main><h1>Register</h1><form action="/register" method="post">
<label for="first_name">Name</label><input id="first_name" name="first_name" type="text" autocomplete="given-name" required>
<label for="last_name">Last Name</label><input id="last_name" name="last_name" type="text" autocomplete="family-name" required>
<label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required>
<label for="username">Username</label><input id="username" name="username" type="text" autocomplete="username" required>
<label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" required>
<button type="submit" disabled>Register</button></form><p id="message" role="status" aria-live="polite"></p><a href="login.html">Login</a></main></body></html>
